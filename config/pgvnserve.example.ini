# Copy to a protected deployment configuration and supply libpq service/password files.
[pgvn]
connection = service=pgvn_service
monitor-connection = service=pgvn_monitor
credential-key-file = C:/PgVN/config/credentials-v1.key
identity-domain = pgvn
listen-host = 127.0.0.1
listen-port = 14690
node-id = svn-node-1
read-only = false
max-connections = 64
max-request-bytes = 67108864
max-response-bytes = 67108864
